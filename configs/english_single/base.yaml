# 英文单语正式方案；所有路径都与旧中英方案隔离。
model:
  vocab_size: 16000
  block_size: 512
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.1
  rope_base: 10000.0
  bias: true

data:
  tokenizer_model: tokenizer/english_single/spm.model
  train_bin: data/english_single/processed/train.bin
  val_bin: data/english_single/processed/val.bin
  train_english_tokens: 0
  val_english_tokens: 0
  english_sample_probability: 1.0

train:
  seed: 41001
  device: cuda
  amp_dtype: float16
  micro_batch_size: 4
  grad_accum_steps: 4
  max_tokens: 240000000
  max_steps: null
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 250
  checkpoint_interval: 1000
  eval_batches: 100
  num_workers: 0
  output_dir: checkpoints/english_single/base
  log_dir: experiments/english_single/base/tensorboard
